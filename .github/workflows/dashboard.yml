name: Dashboard - Build & Deploy (Pages)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'scripts/build-dashboard-data.js'
      - '.github/workflows/dashboard.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.THREADS_GOOGLE_SERVICE_ACCOUNT_KEY }}
      DOC_ID: ${{ secrets.DOC_ID }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      THREADS_SHEET_NAME: ${{ secrets.THREADS_SHEET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build data.json snapshot
        run: npm run build:dashboard
      - name: Render PWA icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 192 -h 192 dashboard/icon.svg -o dashboard/icon-192.png
          rsvg-convert -w 512 -h 512 dashboard/icon.svg -o dashboard/icon-512.png
          rsvg-convert -w 180 -h 180 dashboard/icon.svg -o dashboard/apple-touch-icon.png
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
