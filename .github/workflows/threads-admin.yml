name: Threads Affiliate - Set Cell
on:
  workflow_dispatch:
    inputs:
      judul:
        description: 'Judul Konten (match ke kolom Judul Konten)'
        required: true
      col:
        description: 'Nama kolom (persis header baris 3)'
        required: true
      value:
        description: 'Nilai baru (kosongkan untuk clear)'
        required: false
        default: ''
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      DOC_ID: ${{ secrets.DOC_ID }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      THREADS_SHEET_NAME: ${{ secrets.THREADS_SHEET_NAME }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      JUDUL: ${{ inputs.judul }}
      COL: ${{ inputs.col }}
      VALUE: ${{ inputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run set-cell
