name: Threads Affiliate - Admin
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Aksi'
        type: choice
        options: [set-cell, delete-column]
        default: set-cell
      judul:
        description: '(set-cell) Judul Konten'
        required: false
      col:
        description: 'Nama kolom (persis header baris 3)'
        required: true
      value:
        description: '(set-cell) Nilai baru — kosongkan untuk clear'
        required: false
        default: ''
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      DOC_ID: ${{ secrets.DOC_ID }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      THREADS_SHEET_NAME: ${{ secrets.THREADS_SHEET_NAME }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      JUDUL: ${{ inputs.judul }}
      COL: ${{ inputs.col }}
      VALUE: ${{ inputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - if: inputs.action == 'set-cell'
        run: npm run set-cell
      - if: inputs.action == 'delete-column'
        run: npm run delete-column
