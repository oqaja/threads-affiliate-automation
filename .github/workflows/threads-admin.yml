name: Threads Affiliate - Admin
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Aksi'
        type: choice
        options: [set-cell, delete-column, rename-tab, backfill-row-id, 'shopee:introspect']
        default: set-cell
      judul:
        description: '(set-cell) Judul Konten'
        required: false
      col:
        description: '(set-cell / delete-column) Nama kolom'
        required: false
      value:
        description: '(set-cell) Nilai baru — kosongkan untuk clear'
        required: false
        default: ''
      to:
        description: '(rename-tab) Nama tab baru'
        required: false
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      THREADS_SHEET_NAME: ${{ secrets.THREADS_SHEET_NAME }}
      SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
      SHOPEE_AFFILIATE_APP_SECRET: ${{ secrets.SHOPEE_AFFILIATE_APP_SECRET }}
      JUDUL: ${{ inputs.judul }}
      COL: ${{ inputs.col }}
      VALUE: ${{ inputs.value }}
      TO: ${{ inputs.to }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run ${{ inputs.action }}
